<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b91c1c" />
  <title>Big Hit Society | Mini Pokédex</title>

  <style>
    :root{
      --red:#dc2626;
      --darkred:#991b1b;
      --ink:#111827;
      --screen:#d1fae5;
      --screen2:#a7f3d0;
      --yellow:#facc15;
      --blue:#2563eb;
      --card:#ffffff;
      --muted:#6b7280;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      background:
        radial-gradient(circle at 20% 20%, rgba(37,99,235,.25), transparent 30%),
        linear-gradient(160deg,#0f172a,#1f2937);
      color:white;
    }

    .wrap{
      width:min(470px,100%);
    }

    .brand{
      text-align:center;
      font-weight:1000;
      letter-spacing:.17em;
      font-size:.8rem;
      color:var(--yellow);
      margin-bottom:8px;
    }

    .dex{
      background:linear-gradient(145deg,var(--red),var(--darkred));
      border-radius:30px;
      padding:18px;
      box-shadow:0 24px 70px rgba(0,0,0,.4);
      border:4px solid #7f1d1d;
      position:relative;
    }

    .topRow{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }

    .lens{
      width:56px;
      height:56px;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%,#fff 0 10%,#93c5fd 11% 28%,#2563eb 29% 64%,#1e3a8a 65% 100%);
      border:5px solid white;
      box-shadow:0 0 0 3px #111827;
      flex:none;
    }

    .lights{
      display:flex;
      gap:8px;
      align-self:flex-start;
      padding-top:4px;
    }

    .light{
      width:14px;
      height:14px;
      border-radius:50%;
      border:2px solid rgba(0,0,0,.35);
    }

    .l1{background:#f87171}
    .l2{background:#fde047}
    .l3{background:#4ade80}

    .title{
      margin-left:auto;
      font-weight:1000;
      letter-spacing:.08em;
      color:white;
      font-size:.95rem;
    }

    .screenFrame{
      background:#e5e7eb;
      border-radius:18px;
      padding:12px;
      border:4px solid #111827;
    }

    .screen{
      position:relative;
      min-height:500px;
      border-radius:14px;
      overflow:hidden;
      color:var(--ink);
      background:
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(var(--screen),var(--screen2));
      background-size:18px 18px,18px 18px,auto;
      padding:16px;
      border:3px inset #065f46;
    }

    .scanline{
      position:absolute;
      left:0;
      right:0;
      top:-20%;
      height:35%;
      background:linear-gradient(to bottom, transparent, rgba(255,255,255,.28), transparent);
      animation:scan 3.2s linear infinite;
      pointer-events:none;
    }

    @keyframes scan{
      from{transform:translateY(0)}
      to{transform:translateY(420%)}
    }

    .number{
      font-size:.82rem;
      font-weight:1000;
      letter-spacing:.08em;
      color:#065f46;
    }

    .name{
      margin:2px 0 4px;
      font-size:2rem;
      font-weight:1000;
      text-transform:capitalize;
      line-height:1;
    }

    .types{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-bottom:8px;
    }

    .type{
      padding:5px 9px;
      border-radius:999px;
      background:#111827;
      color:white;
      font-size:.72rem;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .imageBox{
      height:220px;
      display:grid;
      place-items:center;
      margin:6px 0 8px;
    }

    #pokeImg{
      width:210px;
      height:210px;
      object-fit:contain;
      filter:drop-shadow(0 12px 9px rgba(0,0,0,.2));
    }

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin:10px 0;
    }

    .stat{
      background:rgba(255,255,255,.55);
      border:2px solid rgba(6,95,70,.35);
      border-radius:12px;
      padding:9px;
    }

    .label{
      display:block;
      font-size:.68rem;
      font-weight:1000;
      color:#065f46;
      letter-spacing:.06em;
      margin-bottom:2px;
    }

    .value{
      font-size:.92rem;
      font-weight:900;
      text-transform:capitalize;
    }

    .desc{
      background:rgba(255,255,255,.58);
      border:2px solid rgba(6,95,70,.35);
      border-radius:12px;
      padding:10px;
      font-size:.9rem;
      line-height:1.35;
      font-weight:700;
      min-height:72px;
    }

    .controls{
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    button{
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px 15px;
      font-size:1rem;
      font-weight:1000;
      cursor:pointer;
      transition:transform .12s ease;
    }

    button:active{transform:scale(.98)}

    #newBtn{
      background:#111827;
      color:white;
    }

    #soundBtn{
      background:#e5e7eb;
      color:#111827;
    }

    .bottomDots{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top:10px;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:#111827;
      opacity:.8;
    }

    .loading{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      background:rgba(209,250,229,.88);
      z-index:10;
      color:#065f46;
      font-weight:1000;
      text-align:center;
      padding:20px;
    }

    .footer{
      text-align:center;
      color:#d1d5db;
      font-size:.74rem;
      line-height:1.35;
      margin-top:10px;
    }
  
    .searchRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:10px 0 6px}
    #searchInput{width:100%;border:2px solid #111827;border-radius:12px;padding:10px 12px;font-weight:900;font-size:.95rem;outline:none;background:rgba(255,255,255,.9);color:#111827}
    #searchBtn,#randomBtn{width:auto;min-width:76px;padding:10px 10px;border-radius:12px;color:white;font-size:.78rem}
    #searchBtn{background:#2563eb}
    #randomBtn{background:#111827}
    .dexNav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin:6px 0 8px}
    .miniBtn{width:auto;padding:8px 10px;border-radius:10px;font-size:.82rem;background:#111827;color:white}
    .navCenter{text-align:center;font-size:.78rem;font-weight:1000;color:#065f46}
    .featureRow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
    .featureBtn{padding:9px 6px;font-size:.75rem;border-radius:10px;background:rgba(255,255,255,.78);color:#111827;border:2px solid rgba(6,95,70,.35)}
    .featureBtn.active{background:#111827;color:white}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 8px}
    .tabBtn{padding:8px 4px;font-size:.7rem;border-radius:10px;background:rgba(255,255,255,.72);color:#065f46;border:2px solid rgba(6,95,70,.35)}
    .tabBtn.active{background:#065f46;color:white}
    .tabPanel{display:none}.tabPanel.active{display:block}
    .statBars{display:grid;gap:8px;margin-top:8px}
    .barRow{display:grid;grid-template-columns:72px 1fr 34px;gap:8px;align-items:center;font-size:.75rem;font-weight:900}
    .barTrack{height:10px;background:rgba(255,255,255,.6);border:1px solid rgba(6,95,70,.35);border-radius:999px;overflow:hidden}
    .barFill{height:100%;background:#065f46;width:0}
    .movesList,.evoList,.recentList{display:grid;gap:7px;margin-top:8px}
    .moveChip,.evoChip,.recentChip{background:rgba(255,255,255,.62);border:2px solid rgba(6,95,70,.3);border-radius:10px;padding:8px 10px;font-size:.8rem;font-weight:900;text-transform:capitalize;cursor:pointer}
    .emptyState{font-size:.82rem;font-weight:800;color:#065f46;padding:8px 0}
    .metaLine{margin-top:8px;display:flex;flex-wrap:wrap;gap:7px;font-size:.75rem;font-weight:900;color:#065f46}
    .metaPill{background:rgba(255,255,255,.55);border:2px solid rgba(6,95,70,.28);border-radius:999px;padding:5px 8px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:999px;font-weight:900;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:99}
    .toast.show{opacity:1}
    @media (max-width:390px){.featureRow{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.screen{min-height:540px}}

  
    .favoritesPanel{
      display:none;
      margin-top:10px;
      background:rgba(255,255,255,.55);
      border:2px solid rgba(6,95,70,.35);
      border-radius:12px;
      padding:10px;
    }

    .favoritesPanel.active{display:block}

    .favoritesHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
    }

    .favoritesTitle{
      font-size:.82rem;
      font-weight:1000;
      color:#065f46;
      letter-spacing:.05em;
    }

    .favoritesGrid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }

    .favoriteCard{
      background:rgba(255,255,255,.72);
      border:2px solid rgba(6,95,70,.28);
      border-radius:12px;
      padding:8px;
      text-align:center;
      cursor:pointer;
      font-weight:900;
      color:#111827;
    }

    .favoriteCard img{
      width:88px;
      height:88px;
      object-fit:contain;
      display:block;
      margin:0 auto 4px;
      filter:drop-shadow(0 6px 5px rgba(0,0,0,.15));
    }

    .favoriteNum{
      font-size:.68rem;
      color:#065f46;
      font-weight:1000;
    }

    .favoriteName{
      font-size:.78rem;
      text-transform:capitalize;
      margin-top:2px;
    }

    .favoritesEmpty{
      grid-column:1/-1;
      text-align:center;
      font-size:.82rem;
      font-weight:800;
      color:#065f46;
      padding:12px 4px;
    }

    #favoritesBtn{
      background:#facc15;
      color:#111827;
    }

  
    .formSelector{
      display:none;
      gap:6px;
      flex-wrap:wrap;
      margin:7px 0 2px;
    }
    .formSelector.active{display:flex}
    .formBtn{
      width:auto;
      padding:7px 9px;
      border-radius:999px;
      font-size:.68rem;
      background:rgba(255,255,255,.75);
      color:#111827;
      border:2px solid rgba(6,95,70,.35);
    }
    .formBtn.active{background:#7c3aed;color:white}

</style>
</head>

<body>
  <div class="wrap">
    <div class="brand">BIG HIT SOCIETY</div>

    <main class="dex">
      <div class="topRow">
        <div class="lens"></div>
        <div class="lights">
          <div class="light l1"></div>
          <div class="light l2"></div>
          <div class="light l3"></div>
        </div>
        <div class="title">MINI POKÉDEX</div>
      </div>

      <div class="screenFrame">
        <section class="screen">
          <div class="scanline"></div>
          <div class="searchRow">
            <input id="searchInput" placeholder="Search name or #..." autocomplete="off" />
            <button id="searchBtn">SEARCH</button>
            <button id="randomBtn">🎲 RANDOM</button>
          </div>
          <div class="dexNav">
            <button class="miniBtn" id="prevBtn">◀</button>
            <div class="navCenter" id="navLabel">NATIONAL DEX</div>
            <button class="miniBtn" id="nextBtn">▶</button>
          </div>
          <div class="number" id="dexNumber">POKÉDEX #---</div>
          <div class="name" id="pokeName">Loading...</div>
          <div class="types" id="types"></div>
          <div class="formSelector" id="formSelector"></div>
          <div class="imageBox"><img id="pokeImg" alt="Pokémon" /></div>
          <div class="featureRow">
            <button class="featureBtn" id="shinyBtn">✨ SHINY</button>
            <button class="featureBtn" id="favoriteBtn">☆ FAVORITE</button>
            <button class="featureBtn" id="shareBtn">🔗 SHARE</button>
          </div>
          <div class="tabs">
            <button class="tabBtn active" data-tab="infoPanel">INFO</button>
            <button class="tabBtn" data-tab="statsPanel">STATS</button>
            <button class="tabBtn" data-tab="movesPanel">MOVES</button>
            <button class="tabBtn" data-tab="evoPanel">EVOLUTION</button>
          </div>
          <div id="infoPanel" class="tabPanel active">
            <div class="stats">
              <div class="stat"><span class="label">HEIGHT</span><span class="value" id="height">--</span></div>
              <div class="stat"><span class="label">WEIGHT</span><span class="value" id="weight">--</span></div>
              <div class="stat"><span class="label">ABILITY</span><span class="value" id="ability">--</span></div>
              <div class="stat"><span class="label">BASE XP</span><span class="value" id="xp">--</span></div>
            </div>
            <div class="desc" id="description">Searching the Pokédex...</div>
            <div class="metaLine">
              <span class="metaPill" id="generation">Generation --</span>
              <span class="metaPill" id="habitat">Habitat --</span>
            </div>
            <div class="recentList" id="recentList"></div>
          </div>
          <div id="statsPanel" class="tabPanel"><div class="statBars" id="statBars"></div></div>
          <div id="movesPanel" class="tabPanel"><div class="movesList" id="movesList"></div></div>
          <div id="evoPanel" class="tabPanel"><div class="evoList" id="evoList"></div></div>
          <div class="favoritesPanel" id="favoritesPanel">
            <div class="favoritesHeader">
              <div class="favoritesTitle">MY FAVORITES</div>
              <button class="miniBtn" id="closeFavoritesBtn">CLOSE</button>
            </div>
            <div class="favoritesGrid" id="favoritesGrid"></div>
          </div>

          <div class="loading" id="loading">SCANNING POKÉDEX…</div>
        </section>
      </div>

      <div class="controls">
        <button id="favoritesBtn">❤️ MY FAVORITES</button>
        <button id="soundBtn">🔊 Sound: ON</button>
      </div>

      <div class="bottomDots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </main>

    <div class="footer">
      Fan-made Big Hit Society experience. Pokémon names and artwork belong to their respective rights holders.
    </div>
  </div>

<script>
  let soundOn = true;
  let currentPokemon = null;
  let currentSpecies = null;
  let shinyMode = false;

  const MAX_DEX = 1025;
  const FAVORITES_KEY = "miniDexFavorites";
  const RECENT_KEY = "miniDexRecent";

  function beep(freq=440, duration=.08){
    if(!soundOn) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function cleanText(text){
    return text.replace(/\f/g," ").replace(/\n/g," ").replace(/\s+/g," ").trim();
  }

  function metersFromDm(dm){ return (dm / 10).toFixed(1) + " m"; }
  function kgFromHg(hg){ return (hg / 10).toFixed(1) + " kg"; }

  function getPokemonFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const value = params.get("pokemon");
    return value ? value.trim().toLowerCase() : null;
  }

  function setUrlPokemon(value, replace=true){
    const url = new URL(window.location.href);
    url.searchParams.set("pokemon", value);
    if(replace) history.replaceState({}, "", url);
    else history.pushState({}, "", url);
  }

  function titleCase(text){
    return text.replaceAll("-"," ").replace(/\b\w/g, c=>c.toUpperCase());
  }

  function showToast(message){
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1400);
  }

  function getFavorites(){
    try{return JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");}
    catch{return [];}
  }

  function saveFavorites(list){ localStorage.setItem(FAVORITES_KEY, JSON.stringify(list)); }


  async function renderFavorites(){
    const panel = document.getElementById("favoritesPanel");
    const grid = document.getElementById("favoritesGrid");
    const favorites = getFavorites();

    grid.innerHTML = "";
    panel.classList.add("active");

    if(!favorites.length){
      grid.innerHTML = '<div class="favoritesEmpty">No favorites yet. Tap ☆ FAVORITE on any Pokémon to save it here.</div>';
      return;
    }

    grid.innerHTML = '<div class="favoritesEmpty">Loading favorites...</div>';

    try{
      const results = await Promise.all(
        favorites.map(async id=>{
          const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
          if(!res.ok) throw new Error("Favorite load failed");
          return res.json();
        })
      );

      grid.innerHTML = results.map(p=>{
        const artwork = p.sprites.other["official-artwork"].front_default || p.sprites.front_default || "";
        return `<div class="favoriteCard" data-id="${p.id}">
          <img src="${artwork}" alt="${p.name}">
          <div class="favoriteNum">#${String(p.id).padStart(4,"0")}</div>
          <div class="favoriteName">${titleCase(p.name)}</div>
        </div>`;
      }).join("");

      grid.querySelectorAll(".favoriteCard").forEach(card=>{
        card.addEventListener("click",()=>{
          panel.classList.remove("active");
          loadPokemon(card.dataset.id,true);
          window.scrollTo({top:0,behavior:"smooth"});
        });
      });
    }catch(err){
      console.error(err);
      grid.innerHTML = '<div class="favoritesEmpty">Could not load favorites right now.</div>';
    }
  }

  function updateFavoriteButton(){
    if(!currentPokemon) return;
    const favoriteId = currentSpecies?.id || currentPokemon.id;
    const active = getFavorites().includes(favoriteId);
    const btn = document.getElementById("favoriteBtn");
    btn.textContent = active ? "★ FAVORITED" : "☆ FAVORITE";
    btn.classList.toggle("active", active);
  }

  function toggleFavorite(){
    if(!currentPokemon) return;
    let favorites = getFavorites();
    const id = currentSpecies?.id || currentPokemon.id;
    if(favorites.includes(id)){
      favorites = favorites.filter(x=>x!==id);
      showToast("Removed from favorites");
    }else{
      favorites.unshift(id);
      favorites = favorites.slice(0,100);
      showToast("Added to favorites");
    }
    saveFavorites(favorites);
    updateFavoriteButton();
    if(document.getElementById("favoritesPanel").classList.contains("active")){
      renderFavorites();
    }
  }

  function addRecent(pokemon){
    let recent = [];
    try{recent = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");}catch{}
    recent = recent.filter(x=>x.id !== pokemon.id);
    recent.unshift({id:pokemon.id, name:pokemon.name});
    recent = recent.slice(0,2);
    localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
    renderRecent();
  }

  function renderRecent(){
    const box = document.getElementById("recentList");
    let recent = [];
    try{recent = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");}catch{}
    if(!recent.length){
      box.innerHTML = '<div class="emptyState">Recently viewed Pokémon will appear here.</div>';
      return;
    }
    box.innerHTML = '<span class="label">RECENTLY VIEWED</span>' +
      recent.map(p=>`<div class="recentChip" data-id="${p.id}">#${String(p.id).padStart(4,"0")} ${titleCase(p.name)}</div>`).join("");
    box.querySelectorAll(".recentChip").forEach(el=>{
      el.addEventListener("click",()=>loadPokemon(el.dataset.id, true));
    });
  }

  function renderStats(stats){
    const labels = {hp:"HP",attack:"Attack",defense:"Defense","special-attack":"Sp. Atk","special-defense":"Sp. Def",speed:"Speed"};
    const box = document.getElementById("statBars");
    box.innerHTML = stats.map(s=>{
      const value = s.base_stat;
      const pct = Math.min(100,(value/180)*100);
      return `<div class="barRow"><span>${labels[s.stat.name] || s.stat.name}</span><div class="barTrack"><div class="barFill" style="width:${pct}%"></div></div><span>${value}</span></div>`;
    }).join("");
  }

  function renderMoves(pokemon){
    const moves = pokemon.moves.slice(0,8).map(m=>m.move.name);
    document.getElementById("movesList").innerHTML = moves.length
      ? moves.map(m=>`<div class="moveChip">${titleCase(m)}</div>`).join("")
      : '<div class="emptyState">No moves available.</div>';
  }

  function flattenEvolution(chain, arr=[]){
    if(!chain) return arr;
    arr.push({name:chain.species.name,url:chain.species.url});
    chain.evolves_to.forEach(next=>flattenEvolution(next,arr));
    return arr;
  }

  async function renderEvolution(species){
    const box = document.getElementById("evoList");
    box.innerHTML = '<div class="emptyState">Loading evolution chain...</div>';
    try{
      if(!species.evolution_chain?.url) throw new Error("No evolution");
      const res = await fetch(species.evolution_chain.url);
      if(!res.ok) throw new Error("Evolution API error");
      const data = await res.json();
      const entries = flattenEvolution(data.chain);
      box.innerHTML = entries.map(e=>{
        const match = e.url.match(/\/pokemon-species\/(\d+)\//);
        const id = match ? match[1] : e.name;
        return `<div class="evoChip" data-id="${id}">${titleCase(e.name)}</div>`;
      }).join("");
      box.querySelectorAll(".evoChip").forEach(el=>{
        el.addEventListener("click",()=>loadPokemon(el.dataset.id,true));
      });
    }catch{
      box.innerHTML = '<div class="emptyState">No evolution data available.</div>';
    }
  }


  function formLabel(name, baseName){
    if(name === baseName) return "NORMAL";
    if(name.includes("-mega-x")) return "MEGA X";
    if(name.includes("-mega-y")) return "MEGA Y";
    if(name.includes("-mega")) return "MEGA";
    return titleCase(name.replace(baseName + "-", ""));
  }

  async function loadPokemonForm(formName){
    const loading = document.getElementById("loading");
    loading.style.display = "grid";
    try{
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(formName)}`);
      if(!res.ok) throw new Error("Form not found");
      const form = await res.json();

      currentPokemon = form;
      shinyMode = false;

      document.getElementById("pokeName").textContent = form.name.replaceAll("-"," ");

      const types = document.getElementById("types");
      types.innerHTML = "";
      form.types.forEach(t=>{
        const span = document.createElement("span");
        span.className = "type";
        span.textContent = t.type.name;
        types.appendChild(span);
      });

      document.getElementById("height").textContent = metersFromDm(form.height);
      document.getElementById("weight").textContent = kgFromHg(form.weight);
      document.getElementById("ability").textContent =
        form.abilities.length ? form.abilities[0].ability.name.replaceAll("-"," ") : "Unknown";
      document.getElementById("xp").textContent = form.base_experience ?? "--";

      renderStats(form.stats);
      renderMoves(form);
      updateImage();

      document.querySelectorAll(".formBtn").forEach(btn=>{
        btn.classList.toggle("active", btn.dataset.form === formName);
      });

      beep(760,.08);
      setTimeout(()=>beep(920,.08),90);
    }catch(err){
      console.error(err);
      showToast("Could not load this form");
    }finally{
      loading.style.display = "none";
    }
  }

  async function renderForms(pokemon, species){
    const box = document.getElementById("formSelector");
    box.innerHTML = "";
    box.classList.remove("active");

    try{
      const baseName = species.name;
      const candidateNames = new Set([baseName]);

      // PokeAPI exposes Mega Evolutions as Pokémon varieties on the species record.
      (species.varieties || []).forEach(v=>{
        const n = v.pokemon?.name;
        if(n && (n === baseName || n.includes("-mega"))) candidateNames.add(n);
      });

      // Some species variety lists can vary, so test conventional Mega names too.
      const conventional = [`${baseName}-mega`, `${baseName}-mega-x`, `${baseName}-mega-y`];
      const checks = await Promise.all(conventional.map(async name=>{
        try{
          const r = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
          return r.ok ? name : null;
        }catch{return null;}
      }));
      checks.filter(Boolean).forEach(n=>candidateNames.add(n));

      const forms = [...candidateNames];
      if(forms.length <= 1) return;

      box.classList.add("active");
      box.innerHTML = forms.map(name=>
        `<button class="formBtn ${name===baseName ? "active" : ""}" data-form="${name}">${formLabel(name,baseName)}</button>`
      ).join("");

      box.querySelectorAll(".formBtn").forEach(btn=>{
        btn.addEventListener("click",()=>loadPokemonForm(btn.dataset.form));
      });
    }catch(err){
      console.error("Form selector error", err);
    }
  }

  function updateImage(){
    if(!currentPokemon) return;
    const artwork = currentPokemon.sprites.other["official-artwork"];
    const normal = artwork.front_default || currentPokemon.sprites.front_default;
    const shiny = artwork.front_shiny || currentPokemon.sprites.front_shiny || normal;
    document.getElementById("pokeImg").src = shinyMode ? shiny : normal;
    const btn = document.getElementById("shinyBtn");
    btn.textContent = shinyMode ? "✨ SHINY: ON" : "✨ SHINY";
    btn.classList.toggle("active",shinyMode);
  }

  async function loadPokemon(requestedPokemon=null, updateUrl=false){
    const loading = document.getElementById("loading");
    loading.style.display = "grid";
    try{
      let query = requestedPokemon || (Math.floor(Math.random()*MAX_DEX)+1);
      query = String(query).trim().toLowerCase().replace(/\s+/g,"-");

      const [pokemonRes,speciesRes] = await Promise.all([
        fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(query)}`),
        fetch(`https://pokeapi.co/api/v2/pokemon-species/${encodeURIComponent(query)}`)
      ]);

      if(!pokemonRes.ok || !speciesRes.ok) throw new Error("Pokémon not found");

      const pokemon = await pokemonRes.json();
      const species = await speciesRes.json();
      currentPokemon = pokemon;
      currentSpecies = species;
      shinyMode = false;

      const englishEntries = species.flavor_text_entries.filter(e=>e.language && e.language.name==="en");
      const description = englishEntries.length ? cleanText(englishEntries[0].flavor_text) : "No Pokédex description available for this entry.";

      document.getElementById("dexNumber").textContent = `POKÉDEX #${String(pokemon.id).padStart(4,"0")}`;
      document.getElementById("pokeName").textContent = pokemon.name.replaceAll("-"," ");
      document.getElementById("navLabel").textContent = `#${String(pokemon.id).padStart(4,"0")} / ${MAX_DEX}`;

      const types = document.getElementById("types");
      types.innerHTML = "";
      pokemon.types.forEach(t=>{
        const span = document.createElement("span");
        span.className = "type";
        span.textContent = t.type.name;
        types.appendChild(span);
      });

      document.getElementById("height").textContent = metersFromDm(pokemon.height);
      document.getElementById("weight").textContent = kgFromHg(pokemon.weight);
      document.getElementById("ability").textContent = pokemon.abilities.length ? pokemon.abilities[0].ability.name.replaceAll("-"," ") : "Unknown";
      document.getElementById("xp").textContent = pokemon.base_experience ?? "--";
      document.getElementById("description").textContent = description;
      document.getElementById("generation").textContent = species.generation ? titleCase(species.generation.name) : "Generation --";
      document.getElementById("habitat").textContent = species.habitat ? `Habitat: ${titleCase(species.habitat.name)}` : "Habitat: Unknown";

      renderStats(pokemon.stats);
      renderMoves(pokemon);
      renderEvolution(species);
      renderForms(pokemon, species);
      updateImage();
      updateFavoriteButton();
      addRecent(pokemon);

      if(updateUrl) setUrlPokemon(pokemon.id,false);
      else setUrlPokemon(pokemon.id,true);

      document.getElementById("searchInput").value = "";
      beep(520,.08);
      setTimeout(()=>beep(690,.08),90);
    }catch(err){
      console.error(err);
      document.getElementById("description").textContent = "Pokémon not found. Try a valid name or National Pokédex number.";
      showToast("Pokémon not found");
    }finally{
      loading.style.display = "none";
    }
  }

  function doSearch(){
    const value = document.getElementById("searchInput").value.trim();
    if(value) loadPokemon(value,true);
  }

  document.getElementById("randomBtn").addEventListener("click",()=>loadPokemon(null,true));
  document.getElementById("searchBtn").addEventListener("click",doSearch);
  document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter") doSearch();});

  document.getElementById("prevBtn").addEventListener("click",()=>{
    if(!currentPokemon) return;
    loadPokemon(currentPokemon.id<=1 ? MAX_DEX : currentPokemon.id-1,true);
  });

  document.getElementById("nextBtn").addEventListener("click",()=>{
    if(!currentPokemon) return;
    loadPokemon(currentPokemon.id>=MAX_DEX ? 1 : currentPokemon.id+1,true);
  });

  document.getElementById("shinyBtn").addEventListener("click",()=>{
    shinyMode = !shinyMode;
    updateImage();
    beep(shinyMode ? 800 : 520,.08);
  });

  document.getElementById("favoriteBtn").addEventListener("click",toggleFavorite);

  document.getElementById("shareBtn").addEventListener("click",async()=>{
    if(!currentPokemon) return;
    const url = new URL(window.location.href);
    url.searchParams.set("pokemon",currentPokemon.id);
    try{
      if(navigator.share){
        await navigator.share({title:`Mini Pokédex - ${titleCase(currentPokemon.name)}`,text:`Check out ${titleCase(currentPokemon.name)} in the Mini Pokédex`,url:url.toString()});
      }else{
        await navigator.clipboard.writeText(url.toString());
        showToast("Pokédex link copied");
      }
    }catch{}
  });


  document.getElementById("favoritesBtn").addEventListener("click",()=>{
    renderFavorites();
    document.getElementById("favoritesPanel").scrollIntoView({behavior:"smooth",block:"nearest"});
  });

  document.getElementById("closeFavoritesBtn").addEventListener("click",()=>{
    document.getElementById("favoritesPanel").classList.remove("active");
  });

  document.getElementById("soundBtn").addEventListener("click",e=>{
    soundOn = !soundOn;
    e.target.textContent = soundOn ? "🔊 Sound: ON" : "🔇 Sound: OFF";
    if(soundOn) beep(600,.08);
  });

  document.querySelectorAll(".tabBtn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".tabBtn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".tabPanel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  window.addEventListener("popstate",()=>loadPokemon(getPokemonFromUrl() || null,false));

  renderRecent();
  loadPokemon(getPokemonFromUrl());
</script>
  <div class="toast" id="toast"></div>
</body>
</html>
