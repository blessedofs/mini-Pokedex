<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b91c1c" />
  <title>Big Hit Society | Mini Pokédex</title>

  <style>
    :root{
      --red:#dc2626;
      --darkred:#991b1b;
      --ink:#111827;
      --screen:#d1fae5;
      --screen2:#a7f3d0;
      --yellow:#facc15;
      --blue:#2563eb;
      --card:#ffffff;
      --muted:#6b7280;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      background:
        radial-gradient(circle at 20% 20%, rgba(37,99,235,.25), transparent 30%),
        linear-gradient(160deg,#0f172a,#1f2937);
      color:white;
    }

    .wrap{
      width:min(470px,100%);
    }

    .brand{
      text-align:center;
      font-weight:1000;
      letter-spacing:.17em;
      font-size:.8rem;
      color:var(--yellow);
      margin-bottom:8px;
    }

    .dex{
      background:linear-gradient(145deg,var(--red),var(--darkred));
      border-radius:30px;
      padding:18px;
      box-shadow:0 24px 70px rgba(0,0,0,.4);
      border:4px solid #7f1d1d;
      position:relative;
    }

    .topRow{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }

    .lens{
      width:56px;
      height:56px;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%,#fff 0 10%,#93c5fd 11% 28%,#2563eb 29% 64%,#1e3a8a 65% 100%);
      border:5px solid white;
      box-shadow:0 0 0 3px #111827;
      flex:none;
    }

    .lights{
      display:flex;
      gap:8px;
      align-self:flex-start;
      padding-top:4px;
    }

    .light{
      width:14px;
      height:14px;
      border-radius:50%;
      border:2px solid rgba(0,0,0,.35);
    }

    .l1{background:#f87171}
    .l2{background:#fde047}
    .l3{background:#4ade80}

    .title{
      margin-left:auto;
      font-weight:1000;
      letter-spacing:.08em;
      color:white;
      font-size:.95rem;
    }

    .screenFrame{
      background:#e5e7eb;
      border-radius:18px;
      padding:12px;
      border:4px solid #111827;
    }

    .screen{
      position:relative;
      min-height:500px;
      border-radius:14px;
      overflow:hidden;
      color:var(--ink);
      background:
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(var(--screen),var(--screen2));
      background-size:18px 18px,18px 18px,auto;
      padding:16px;
      border:3px inset #065f46;
    }

    .scanline{
      position:absolute;
      left:0;
      right:0;
      top:-20%;
      height:35%;
      background:linear-gradient(to bottom, transparent, rgba(255,255,255,.28), transparent);
      animation:scan 3.2s linear infinite;
      pointer-events:none;
    }

    @keyframes scan{
      from{transform:translateY(0)}
      to{transform:translateY(420%)}
    }

    .number{
      font-size:.82rem;
      font-weight:1000;
      letter-spacing:.08em;
      color:#065f46;
    }

    .name{
      margin:2px 0 4px;
      font-size:2rem;
      font-weight:1000;
      text-transform:capitalize;
      line-height:1;
    }

    .types{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-bottom:8px;
    }

    .type{
      padding:5px 9px;
      border-radius:999px;
      background:#111827;
      color:white;
      font-size:.72rem;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .imageBox{
      height:220px;
      display:grid;
      place-items:center;
      margin:6px 0 8px;
    }

    #pokeImg{
      width:210px;
      height:210px;
      object-fit:contain;
      filter:drop-shadow(0 12px 9px rgba(0,0,0,.2));
    }

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin:10px 0;
    }

    .stat{
      background:rgba(255,255,255,.55);
      border:2px solid rgba(6,95,70,.35);
      border-radius:12px;
      padding:9px;
    }

    .label{
      display:block;
      font-size:.68rem;
      font-weight:1000;
      color:#065f46;
      letter-spacing:.06em;
      margin-bottom:2px;
    }

    .value{
      font-size:.92rem;
      font-weight:900;
      text-transform:capitalize;
    }

    .desc{
      background:rgba(255,255,255,.58);
      border:2px solid rgba(6,95,70,.35);
      border-radius:12px;
      padding:10px;
      font-size:.9rem;
      line-height:1.35;
      font-weight:700;
      min-height:72px;
    }

    .controls{
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    button{
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px 15px;
      font-size:1rem;
      font-weight:1000;
      cursor:pointer;
      transition:transform .12s ease;
    }

    button:active{transform:scale(.98)}

    #newBtn{
      background:#111827;
      color:white;
    }

    #soundBtn{
      background:#e5e7eb;
      color:#111827;
    }

    .bottomDots{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top:10px;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:#111827;
      opacity:.8;
    }

    .loading{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      background:rgba(209,250,229,.88);
      z-index:10;
      color:#065f46;
      font-weight:1000;
      text-align:center;
      padding:20px;
    }

    .footer{
      text-align:center;
      color:#d1d5db;
      font-size:.74rem;
      line-height:1.35;
      margin-top:10px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="brand">BIG HIT SOCIETY</div>

    <main class="dex">
      <div class="topRow">
        <div class="lens"></div>
        <div class="lights">
          <div class="light l1"></div>
          <div class="light l2"></div>
          <div class="light l3"></div>
        </div>
        <div class="title">MINI POKÉDEX</div>
      </div>

      <div class="screenFrame">
        <section class="screen">
          <div class="scanline"></div>

          <div class="number" id="dexNumber">POKÉDEX #---</div>
          <div class="name" id="pokeName">Loading...</div>
          <div class="types" id="types"></div>

          <div class="imageBox">
            <img id="pokeImg" alt="Pokémon" />
          </div>

          <div class="stats">
            <div class="stat">
              <span class="label">HEIGHT</span>
              <span class="value" id="height">--</span>
            </div>

            <div class="stat">
              <span class="label">WEIGHT</span>
              <span class="value" id="weight">--</span>
            </div>

            <div class="stat">
              <span class="label">ABILITY</span>
              <span class="value" id="ability">--</span>
            </div>

            <div class="stat">
              <span class="label">BASE XP</span>
              <span class="value" id="xp">--</span>
            </div>
          </div>

          <div class="desc" id="description">
            Searching the Pokédex...
          </div>

          <div class="loading" id="loading">
            SCANNING POKÉDEX…
          </div>
        </section>
      </div>

      <div class="controls">
        <button id="newBtn">🔎 DISCOVER ANOTHER</button>
        <button id="soundBtn">🔊 Sound: ON</button>
      </div>

      <div class="bottomDots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </main>

    <div class="footer">
      Fan-made Big Hit Society experience. Pokémon names and artwork belong to their respective rights holders.
    </div>
  </div>

<script>
  let soundOn = true;

  function beep(freq=440, duration=.08){
    if(!soundOn) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function cleanText(text){
    return text
      .replace(/\f/g," ")
      .replace(/\n/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function metersFromDm(dm){
    return (dm / 10).toFixed(1) + " m";
  }

  function kgFromHg(hg){
    return (hg / 10).toFixed(1) + " kg";
  }

  async function loadPokemon(){
    const loading = document.getElementById("loading");
    loading.style.display = "grid";

    try{
      const id = Math.floor(Math.random()*1025)+1;

      const [pokemonRes, speciesRes] = await Promise.all([
        fetch(`https://pokeapi.co/api/v2/pokemon/${id}`),
        fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`)
      ]);

      if(!pokemonRes.ok || !speciesRes.ok) throw new Error("API error");

      const pokemon = await pokemonRes.json();
      const species = await speciesRes.json();

      const image =
        pokemon.sprites.other["official-artwork"].front_default
        || pokemon.sprites.front_default;

      const englishEntries = species.flavor_text_entries.filter(
        e => e.language && e.language.name === "en"
      );

      const description = englishEntries.length
        ? cleanText(englishEntries[0].flavor_text)
        : "No Pokédex description available for this entry.";

      document.getElementById("dexNumber").textContent =
        `POKÉDEX #${String(pokemon.id).padStart(4,"0")}`;

      document.getElementById("pokeName").textContent =
        pokemon.name.replaceAll("-"," ");

      document.getElementById("pokeImg").src = image;
      document.getElementById("pokeImg").alt = pokemon.name;

      const types = document.getElementById("types");
      types.innerHTML = "";
      pokemon.types.forEach(t=>{
        const span = document.createElement("span");
        span.className = "type";
        span.textContent = t.type.name;
        types.appendChild(span);
      });

      document.getElementById("height").textContent =
        metersFromDm(pokemon.height);

      document.getElementById("weight").textContent =
        kgFromHg(pokemon.weight);

      document.getElementById("ability").textContent =
        pokemon.abilities.length
          ? pokemon.abilities[0].ability.name.replaceAll("-"," ")
          : "Unknown";

      document.getElementById("xp").textContent =
        pokemon.base_experience ?? "--";

      document.getElementById("description").textContent = description;

      beep(520,.08);
      setTimeout(()=>beep(690,.08),90);

    }catch(err){
      console.error(err);
      document.getElementById("description").textContent =
        "Could not load the Pokédex entry. Check your internet connection and try again.";
    }finally{
      loading.style.display = "none";
    }
  }

  document.getElementById("newBtn").addEventListener("click", loadPokemon);

  document.getElementById("soundBtn").addEventListener("click", e=>{
    soundOn = !soundOn;
    e.target.textContent = soundOn ? "🔊 Sound: ON" : "🔇 Sound: OFF";
    if(soundOn) beep(600,.08);
  });

  loadPokemon();
</script>
</body>
</html>
